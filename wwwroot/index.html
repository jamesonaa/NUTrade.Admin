<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NUTrade Admin Portal | National University Lipa</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />

    <!-- Google Fonts: Outfit & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/nutrade.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="NUTrade.Admin.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #F4F6F8; color: #002B5B; font-family: 'Outfit', sans-serif;">
            <div style="width: 52px; height: 52px; border-radius: 12px; border: 1.5px solid #E5A900; background: #002B5B; display: flex; align-items: center; justify-content: center; font-size: 1.25rem; font-weight: 800; color: #E5A900; margin-bottom: 1rem;">
                NU
            </div>
            <div style="font-size: 1.1rem; font-weight: 700; letter-spacing: -0.01em; margin-bottom: 0.35rem;">
                NUTrade Admin Portal
            </div>
            <div style="font-size: 0.82rem; color: #64748B; margin-bottom: 1.35rem;">
                Loading admin console...
            </div>
            <svg class="loading-progress" style="position: relative; inset: auto; margin: 0 auto; width: 3rem; height: 3rem;">
                <circle r="40%" cx="50%" cy="50%" style="stroke: #E2E8F0; stroke-width: 0.35rem;" />
                <circle r="40%" cx="50%" cy="50%" style="stroke: #002B5B; stroke-width: 0.35rem;" />
            </svg>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <!-- Firebase Web SDK v9 compat -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <!-- EmailJS SDK for admin security code email delivery -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

    <!-- Firebase JS Interop Scripts -->
    <script src="js/firebaseInterop.js"></script>

    <!-- Blazor WASM Script -->
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
